# Experiment 4: E3 plus the two 25 Oct changes, nothing else. Same pool, budget and hyperparameters as
# configs/ippo_warm_scene1_a5-10_ll2.yaml, so any difference comes from:
#   reward.exempt_chosen_stops  a chosen STOP is not charged the 250 in training (team decision, 25 Oct);
#                               forced halts still are. Results are still reported with the official reward.
#   ppo.value_norm              the critic learns standardised returns (Yu et al., 2022).
# Question: do arrivals stop eroding when giving way is no longer punished?
name: ippo_warm_scene1_a5-10_ll2_nostop
critic: local
env:
  source: pool
  pool: pools/scene1_a5-10_ll2
  disruption: none
reward:
  scale: 0.01
  progress: 0.0
  exempt_chosen_stops: true
ppo:
  gamma: 0.99
  gae_lambda: 0.95
  clip: 0.2
  epochs: 4
  minibatch_size: 1024
  lr: 0.0001
  entropy_coef: 0.01
  value_coef: 0.5
  max_grad_norm: 0.5
  value_norm: true
train:
  iterations: 100
  episodes_per_iteration: 32
  workers: 10
  init_checkpoint: third_party/ecml2026-starterkit/reinforcement_learning/checkpoint.pt
  save_every: 10
  eval_episodes: 16
