# Experiment 5: E4 plus two costs, nothing else (option 3, decided 26 Oct). E4 made a chosen STOP free and
# every seed learned to stop and wait, because lateness and not arriving are only charged at arrival or at
# the episode's end. Same pool, budget and hyperparameters as E4 (configs/ippo_warm_scene1_a5-10_ll2_nostop.yaml):
#   reward.chosen_stop_cost  a chosen STOP costs 25 instead of 250 (below 50, so serving a station still
#                            beats skipping it); forced halts still cost 250.
#   reward.waiting_cost      0.5 per step for every train that may travel but has not arrived, so standing
#                            still costs something immediately.
# Results are still reported with the official reward.
# Question: does giving way stay cheap without trains learning to stop and wait?
name: ippo_warm_scene1_a5-10_ll2_stopcost
critic: local
env:
  source: pool
  pool: pools/scene1_a5-10_ll2
  disruption: none
reward:
  scale: 0.01
  progress: 0.0
  exempt_chosen_stops: true
  chosen_stop_cost: 25.0
  waiting_cost: 0.5
ppo:
  gamma: 0.99
  gae_lambda: 0.95
  clip: 0.2
  epochs: 4
  minibatch_size: 1024
  lr: 0.0001
  entropy_coef: 0.01
  value_coef: 0.5
  max_grad_norm: 0.5
  value_norm: true
train:
  iterations: 100
  episodes_per_iteration: 32
  workers: 10
  init_checkpoint: third_party/ecml2026-starterkit/reinforcement_learning/checkpoint.pt
  save_every: 10
  eval_episodes: 16
