# Experiment 10: IPPO trained in dense traffic (15-20 trains) for 400 iterations.
# Identical to configs/ippo_warm_scene1_a5-10_ll2_stopcost_400.yaml (E9) except name and env.pool.
# Question: does the central critic help more when trains must coordinate more? Plan: EXPERIMENTS.md, E10.
name: ippo_warm_scene1_a15-20_ll2_stopcost_400
critic: local
env:
  source: pool
  pool: pools/scene1_a15-20_ll2
  disruption: none
reward:
  scale: 0.01
  progress: 0.0
  exempt_chosen_stops: true
  chosen_stop_cost: 25.0
  waiting_cost: 0.5
ppo:
  gamma: 0.99
  gae_lambda: 0.95
  clip: 0.2
  epochs: 4
  minibatch_size: 1024
  lr: 0.0001
  entropy_coef: 0.01
  value_coef: 0.5
  max_grad_norm: 0.5
  value_norm: true
train:
  iterations: 400
  episodes_per_iteration: 32
  workers: 10
  init_checkpoint: third_party/ecml2026-starterkit/reinforcement_learning/checkpoint.pt
  save_every: 10
  eval_episodes: 16
  eval_mode: sampled
